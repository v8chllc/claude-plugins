[project]
name = "claude-plugins"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "black==26.5.1",
  "mypy==2.3.0",
  "pytest==9.0.3",
  "pyyaml==6.0.3",
  "ruff==0.14.9",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
  \.git
  | \.venv
  | __pycache__
  | node_modules
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  "__pycache__",
  "node_modules",
]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
  "W",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = [
  "plugins",
  "tests",
]
exclude = [
  "__pycache__",
  "node_modules",
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
disallow_untyped_defs = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
python_files = [
  "test_*.py",
]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
